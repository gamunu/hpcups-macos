name: release

# release-please keeps a release PR open with the next version and
# changelog, computed from Conventional Commits on main. Merging that PR
# tags the version and creates the GitHub Release; the build job then
# attaches the pkg and the Sparkle appcast to it. Nobody tags by hand.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
          swift --version

      - name: Install jpeg-turbo
        run: brew install jpeg-turbo pkgconf

      - name: Check Sparkle keys
        run: |
          if [ -z "$SPARKLE_PUBLIC_KEY" ]; then
            echo "::warning::Repository variable SPARKLE_PUBLIC_KEY is not set. The app is built without SUPublicEDKey and cannot verify updates."
          fi
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::warning::Secret SPARKLE_PRIVATE_KEY is not set. The release has no appcast.xml, so installed apps will not see this update."
          fi

      - name: Build filter
        run: make

      - name: Test filter
        run: make test

      - name: Build pkg
        run: scripts/build-pkg.sh

      - name: Release notes
        run: |
          gh release view "$TAG" --json body -q .body > build/notes.md
          cat build/notes.md

      - name: Build appcast
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::warning::Skipping appcast.xml because SPARKLE_PRIVATE_KEY is not set."
            exit 0
          fi
          scripts/make-appcast.sh build/hpcups-macos-*.pkg build/appcast.xml build/notes.md
          cat build/appcast.xml

      - name: Upload assets
        run: |
          set -- build/hpcups-macos-*.pkg
          [ -f build/appcast.xml ] && set -- "$@" build/appcast.xml
          gh release upload "$TAG" "$@" --clobber
