name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macos-26 ships Xcode 26.6 (Swift 6.2 or newer), enough for swift-tools-version 6.0.
    runs-on: macos-26
    timeout-minutes: 30
    env:
      SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check license headers
        run: scripts/check-spdx.sh

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
          swift --version

      - name: Install jpeg-turbo
        run: brew install jpeg-turbo pkgconf

      - name: Build filter
        run: make

      - name: Test filter
        run: make test

      - name: Test app
        working-directory: app
        run: swift test

      - name: Build app
        run: scripts/build-app.sh

      - name: Build pkg
        run: scripts/build-pkg.sh

      - name: Upload pkg
        uses: actions/upload-artifact@v7.0.2
        with:
          name: hpcups-macos-pkg
          path: build/hpcups-macos-*.pkg
          if-no-files-found: error
